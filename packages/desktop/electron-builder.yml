npmRebuild: false
appId: app.familiaragent.desktop
productName: FamiliarAgent
executableName: FamiliarAgent
protocols:
  - name: FamiliarAgent agent link
    schemes:
      - familiaragent
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  - "!node_modules/@getpaseo/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../../LICENSE
    to: licenses/Paseo-LICENSE.txt
  - from: ../../NOTICE-FamiliarAgent.md
    to: licenses/NOTICE-FamiliarAgent.md
  - from: ../../UPSTREAM.json
    to: licenses/UPSTREAM.json
  - from: ../../integrations/discord-connector/LICENSE
    to: licenses/Discord-Connector-LICENSE.txt
  - from: assets/familiar
    to: familiar
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish: null
mac:
  artifactName: "FamiliarAgent-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  extendInfo:
    NSDocumentsFolderUsageDescription: FamiliarAgent and the agent tools you start need access to the project folders you select in Documents.
    NSDesktopFolderUsageDescription: FamiliarAgent opens the project folders you select on your Desktop.
    NSDownloadsFolderUsageDescription: FamiliarAgent opens and saves files you select in Downloads.
    NSLocalNetworkUsageDescription: FamiliarAgent connects to the SSH servers you add to share agent workspaces and files.
  hardenedRuntime: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/familiar
      to: bin/familiar
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "FamiliarAgent-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "FamiliarAgent"
  extraResources:
    - from: bin/familiar
      to: bin/familiar
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=FamiliarAgent"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "FamiliarAgent-${arch}.${ext}"
win:
  artifactName: "FamiliarAgent-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
