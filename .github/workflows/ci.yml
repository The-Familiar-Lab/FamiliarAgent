name: FamiliarAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: familiar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  familiar-checks:
    name: FamiliarAgent checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/discord-connector/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Discord connector dependencies
        run: npm ci --prefix integrations/discord-connector --no-audit --no-fund

      # Types resolve the shared packages' outputs. The MCP integration test also
      # launches the compiled CLI against an isolated daemon with test providers.
      - name: Build shared packages, server and CLI
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Check FamiliarAgent and daemon integration
        run: npm run verify:familiar -- --integration

      - name: Save verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: familiar-verification-${{ github.run_attempt }}
          path: ${{ github.workspace }}/../work/familiar-verification/
          if-no-files-found: ignore
          retention-days: 7
