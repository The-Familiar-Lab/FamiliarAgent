name: FamiliarAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: familiar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  familiar-checks:
    name: FamiliarAgent checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/discord-connector/package-lock.json

      - name: Resolve verification log directory
        id: verification_paths
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'directory=' + require('node:path').resolve('../work/familiar-verification') + '\n')"

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Discord connector dependencies
        run: npm ci --prefix integrations/discord-connector --no-audit --no-fund

      - name: Generate Discord connector database types
        run: npm run prisma:generate --prefix integrations/discord-connector -- --schema=prisma/schema.prisma

      # Types resolve the shared packages' outputs. The MCP integration test also
      # launches the compiled CLI against an isolated daemon with test providers.
      - name: Build shared packages, server and CLI
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Check FamiliarAgent and daemon integration
        run: npm run verify:familiar -- --integration

      - name: Save verification logs
        if: ${{ !cancelled() && steps.verification_paths.outputs.directory != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: familiar-verification-${{ github.run_attempt }}
          path: ${{ steps.verification_paths.outputs.directory }}
          if-no-files-found: ignore
          retention-days: 7
